<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="Titulo">Just Music</title>
    <link rel="shortcut icon" href="../../Static/Font/hard-drive.png" type="image/x-icon">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline';">
    <link rel="stylesheet" href="../../Static/Styles/Prueba.css">
    <link rel="stylesheet" href="./style.css">
    <!--<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>-->
    <link rel="stylesheet" href="../../Static/Styles/output.css">

</head>
<!--class="bg-black- text-white flex flex-col w-max-content h-screen mx-auto"-->
<body class="bg-black text-white flex max-h-dvw mx-auto items-center justify-center ">
    <div id="loader">
            <img class="bg-white p-1 m-1" src="../../Static/Font/hard-drive.png" alt="">
    </div>
    <div id="contents" style="display: none;">
        <div id="logo_div" class="flex left-0">
            <img id="MinLogo" class="" src="../../Static/Font/hard-drive.png" alt=""> 
            <h1 id="Titulo" >   Just Music</h1>
        </div>
    <button id="select-directory" class="bg-white m-0.5 p-1"><img src="../../Static/Font/folder.png" alt=""></button>
    <span id="Ruta" class="text-center text-white">Sin ruta</span>
    <table id="music-table" class="min-w-full  text-purple-200">
        <thead>
            <tr class="border-r-gray-400 border-t-gray-400 p-1.5 border-2 border-double">
                <th class="columna-1">Canción</th>
                <th class="columna-2"><img id="time" src="../../Static/Font/time.png"></th>
                <th class="columna-3" id="Play"></th>
            </tr>
        </thead>
        <tbody id="music-list">
        </tbody>
    </table>
    <div id="Audio-Controles" class="sticky-bottom">
        <div id="Nombre-song"></div>
        <audio id="audio" controls>
            <source id="audioSource" src="" type="audio/mpeg">
            <!--Tu navegador no soporta el elemento de audio.-->
        </audio>
    </div>
    </div>
    <script src="../../renderer.js"></script>
</body>
</html>
